# Commenting part is based on https://github.com/cloudflare/pages-action/issues/16
name: Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Comment deploy start
        if: github.event_name != 'push'
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message-id: cloudflare-deploy
          message: |
            ### <span aria-hidden="true">🚧</span> Deploy Preview building...

            |  Name | Link |
            |---------------------------------|------------------------|
            |<span aria-hidden="true">🔨</span> Latest commit | ${{ github.sha }} |
            |<span aria-hidden="true">🔍</span> Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            ---

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare Flutter build environment
        uses: ./.github/actions/prepare-flutter-build-environment

      - name: Build production web
        run: flutter build web --release --web-renderer canvaskit --source-maps --build-number ${{ github.run_number }} --dart-define="SENTRY_ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' ||  'preview'  }}" --dart-define="SENTRY_RELEASE=${{ github.sha }}"

      # cloudflare/pages-action was removed from GitHub in September 2026;
      # wrangler-action is Cloudflare's replacement. Wrangler is installed in an
      # empty directory so the Flutter checkout and build output stay untouched.
      - name: Prepare an isolated Wrangler workspace
        run: mkdir -p "${RUNNER_TEMP}/wrangler"

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        id: cloudflare
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'
          packageManager: npm
          workingDirectory: ${{ runner.temp }}/wrangler
          command: >-
            pages deploy ${{ github.workspace }}/build/web
            --project-name=tvarkau-lietuva
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true

      - name: Comment deploy url
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        if: github.event_name != 'push'
        with:
          message-id: cloudflare-deploy
          message: |
            ### <span aria-hidden="true">✅</span> Deploy Preview ready!

            |  Name | Link |
            |---------------------------------|------------------------|
            |<span aria-hidden="true">🔨</span> Latest commit | ${{ github.sha }} |
            |<span aria-hidden="true">🔍</span> Latest deploy log | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |
            |<span aria-hidden="true">😎</span> Deploy Preview Url | [${{ steps.cloudflare.outputs.deployment-url }}](${{ steps.cloudflare.outputs.deployment-url }}) |
            |<span aria-hidden="true">🌳</span> Environment | ${{ steps.cloudflare.outputs.pages-environment }} |
            ---

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        if: github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: biip
          SENTRY_PROJECT: tvarkau-lietuva-frontend
          SENTRY_URL: https://sentry.biip.lt/
        with:
          environment: ${{ github.ref == 'refs/heads/main' && 'production' ||  'preview'  }}
          sourcemaps: build/web
          ignore_missing: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build
          retention-days: 3
          path: build/web
